# Checks, builds and deploys the game to GitHub Pages when run by hand
# ("Run workflow", or `gh workflow run deploy.yml --ref main`), never on a
# push: our fork releases only when asked (docs/PLAN.md, release mode). The
# build is the full one, dev pages included. Run it on main only: Pages'
# github-pages environment lets the default branch deploy, nothing else.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Releases come from main only (decision map p3).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
