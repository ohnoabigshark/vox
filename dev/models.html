<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Models · Dev</title>
    <style>
      body {
        margin: 0;
        font-family: 'Creepster', system-ui, sans-serif;
        background: #2b2140;
        color: #f7f1e3;
      }
      header {
        display: flex;
        gap: 1rem;
        align-items: baseline;
        padding: 0.5rem 0.75rem;
      }
      header a {
        color: #8fd3ff;
      }
      #list,
      #light {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        padding: 0 0.75rem 0.5rem;
      }
      #list button,
      #light button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.3rem 0.7rem;
        border: 0;
        border-radius: 6px;
        background: #4a3d66;
        color: white;
      }
      #list button.on,
      #light button.on {
        background: #a259ff;
      }
      #info {
        padding: 0 0.75rem;
        font-size: 0.8rem;
        opacity: 0.8;
      }
      canvas {
        display: block;
      }
      body.render header,
      body.render #list,
      body.render #light,
      body.render #info {
        display: none;
      }
    </style>
    <link rel="stylesheet" href="/src/ui/fonts.css" />
  </head>
  <body>
    <!-- Dev tool (M1.4): look at voxel models. Excluded by `npm run build:release`.
         ?render=turntable&model=<id>  front, ¾ and side views (used by `npm run preview-models`)
         ?render=sheet&group=<folder>  every model in a folder side by side, to compare scale
         &light=game&turf=<forest|candy|farm>  in the game's light on that area's turf (any mode) -->
    <header>
      <a href="./">← dev</a>
      <strong>Models</strong>
    </header>
    <div id="light"></div>
    <div id="list"></div>
    <div id="info"></div>
    <canvas id="view"></canvas>
    <script type="module" src="/src/dev/modelViewer.ts"></script>
  </body>
</html>
