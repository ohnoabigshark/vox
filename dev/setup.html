<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dev Setup · Dev</title>
    <link rel="stylesheet" href="/src/ui/fonts.css" />
    <!-- The editors' palette and toggle (map round 5, p2). -->
    <link rel="stylesheet" href="/src/dev/controls.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0.5rem 0.75rem 2rem;
        background: var(--night);
        color: var(--text);
        font:
          15px/1.4 system-ui,
          -apple-system,
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      header {
        display: flex;
        gap: 1rem;
        align-items: baseline;
        font-family: 'Creepster', system-ui, sans-serif;
        font-size: 1.2rem;
      }
      a {
        color: var(--line);
      }
      h2 {
        font-family: 'Creepster', system-ui, sans-serif;
        font-weight: normal;
        font-size: 1.15rem;
        margin: 1.1rem 0 0.4rem;
        color: var(--pumpkin);
      }
      .note {
        font-size: 0.9rem;
        background: var(--panel);
        border-left: 4px solid var(--pumpkin);
        padding: 0.5rem 0.7rem;
        border-radius: 6px;
      }
      .changed {
        font-size: 0.85rem;
        color: var(--dim);
      }
      .row,
      .togs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 0.8rem;
        min-height: 2.6rem;
        padding: 0.4rem 0.6rem;
        margin: 0.3rem 0;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
      }
      .row {
        justify-content: space-between;
      }
      .togs {
        gap: 0.4rem;
      }
      .row small,
      .togs small {
        flex-basis: 100%;
        font-size: 0.75rem;
        color: var(--dim);
      }
      select,
      input {
        font: inherit;
        font-size: 0.9rem;
        padding: 0.3rem 0.4rem;
        border-radius: 6px;
        border: 1px solid var(--edge);
        background: var(--night);
        color: var(--text);
        max-width: 60%;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1.2rem;
      }
      .buttons button {
        font: inherit;
        font-weight: 700;
        padding: 0.6rem 1rem;
        border: 1px solid var(--pumpkin);
        border-radius: 8px;
        background: var(--pumpkin);
        color: #1a1206;
      }
      .buttons button.quiet {
        background: none;
        border-color: var(--edge);
        color: var(--dim);
        font-weight: 600;
      }
      .status {
        margin-top: 0.8rem;
        padding: 0.5rem 0.7rem;
        border-radius: 6px;
        background: var(--panel);
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .status.bad {
        background: var(--bad-bg);
        border: 1px solid var(--bad);
        color: #ffb4ab;
      }
    </style>
  </head>
  <body>
    <!-- Dev tool (docs/DEV_SETUP.md): the run options saved on this phone for every new run. -->
    <main id="setup"></main>
    <script type="module" src="/src/dev/setup/main.ts"></script>
  </body>
</html>
